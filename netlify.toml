[build]
  command = "npx -y node@22.12.0 ./node_modules/astro/bin/astro.mjs build"
  publish = "dist"

# Redirections vers URLs avec trailing slash (Astro trailingSlash: 'always')
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301
[[redirects]]
  from = "/portfolio"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/tarifs"
  to = "/tarifs/"
  status = 301
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/cgv"
  to = "/cgv/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat/"
  status = 301

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
