<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Exemple fictif d'un site non adapte aux telephones</title>
  <desc id="desc">Deux telephones comparent une page de bureau simplement reduite, aux liens minuscules et au contenu coupe, avec une page mobile reorganisee et lisible.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#27221f" flood-opacity=".2"/>
    </filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ceb999"/>
      <stop offset="1" stop-color="#4d6656"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#f3efe8"/>
  <rect x="48" y="34" width="1104" height="56" rx="28" fill="#ded6ca"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#4c4540">EXEMPLE FICTIF - AFFICHAGE MOBILE</text>

  <text x="302" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#a33e3e">PAGE DE BUREAU RETRECIE</text>
  <text x="898" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#32705c">CONTENU REORGANISE</text>

  <g filter="url(#shadow)">
    <rect x="142" y="162" width="320" height="536" rx="42" fill="#1f2021"/>
    <rect x="738" y="162" width="320" height="536" rx="42" fill="#1f2021"/>
  </g>
  <rect x="158" y="182" width="288" height="494" rx="26" fill="#fff"/>
  <rect x="754" y="182" width="288" height="494" rx="26" fill="#fff"/>
  <rect x="254" y="169" width="96" height="10" rx="5" fill="#0d0e0e"/>
  <rect x="850" y="169" width="96" height="10" rx="5" fill="#0d0e0e"/>

  <!-- Mauvaise version : une page de 940 px reduite dans 288 px -->
  <rect x="158" y="182" width="240" height="168" fill="url(#hero)"/>
  <rect x="398" y="182" width="48" height="494" fill="#050505"/>
  <text x="176" y="203" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">ACCUEIL</text>
  <text x="213" y="203" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">A PROPOS</text>
  <text x="258" y="203" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">ACCOMPAGNEMENT</text>
  <text x="324" y="203" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">TARIFS</text>
  <text x="354" y="203" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">CONTACT</text>
  <text x="276" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#fff">Cabinet Horizon</text>
  <text x="276" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff">Psychologue clinicienne - consultations au cabinet</text>
  <rect x="238" y="294" width="76" height="15" fill="none" stroke="#fff" stroke-width=".8"/>
  <text x="276" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" font-weight="700" fill="#fff">PRENDRE RENDEZ-VOUS</text>
  <text x="180" y="382" font-family="Georgia, serif" font-size="12" fill="#463f3a">A propos de mon approche</text>
  <rect x="180" y="398" width="194" height="3" rx="1.5" fill="#d2cbc0"/>
  <rect x="180" y="409" width="206" height="3" rx="1.5" fill="#d2cbc0"/>
  <rect x="180" y="420" width="180" height="3" rx="1.5" fill="#d2cbc0"/>
  <rect x="180" y="431" width="198" height="3" rx="1.5" fill="#d2cbc0"/>
  <rect x="180" y="462" width="95" height="116" fill="#e8e0d5"/>
  <rect x="286" y="462" width="100" height="116" fill="#d7c5bb"/>
  <text x="180" y="621" font-family="Arial, sans-serif" font-size="7" fill="#504943">Contenu coupe</text>
  <path d="M165 634 H392" stroke="#b94b4b" stroke-width="3"/>
  <path d="M165 634 l12 -7 v14z M392 634 l-12 -7 v14z" fill="#b94b4b"/>
  <text x="278" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#9c3939">Defilement horizontal</text>

  <!-- Bonne version -->
  <rect x="754" y="182" width="288" height="72" rx="26" fill="#eef1ed"/>
  <rect x="754" y="228" width="288" height="26" fill="#eef1ed"/>
  <circle cx="785" cy="216" r="15" fill="#3b745f"/>
  <text x="812" y="221" font-family="Georgia, serif" font-size="17" fill="#30463d">Cabinet Horizon</text>
  <rect x="995" y="204" width="24" height="3" rx="1.5" fill="#30463d"/>
  <rect x="995" y="214" width="24" height="3" rx="1.5" fill="#30463d"/>
  <rect x="995" y="224" width="24" height="3" rx="1.5" fill="#30463d"/>
  <rect x="754" y="254" width="288" height="190" fill="url(#hero)"/>
  <rect x="754" y="254" width="288" height="190" fill="#17231e" opacity=".48"/>
  <text x="782" y="297" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#dce9e3">PSYCHOLOGUE A VILLE-EXEMPLE</text>
  <text x="782" y="337" font-family="Georgia, serif" font-size="28" fill="#fff">Un premier contact</text>
  <text x="782" y="368" font-family="Georgia, serif" font-size="28" fill="#fff">plus simple</text>
  <text x="782" y="399" font-family="Arial, sans-serif" font-size="13" fill="#fff">Cadre, tarifs et rendez-vous accessibles.</text>
  <rect x="782" y="461" width="232" height="48" rx="7" fill="#3b745f"/>
  <text x="898" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">PRENDRE RENDEZ-VOUS</text>
  <text x="782" y="551" font-family="Georgia, serif" font-size="23" fill="#3b3937">Informations pratiques</text>
  <rect x="782" y="569" width="232" height="14" rx="7" fill="#e5e0d8"/>
  <rect x="782" y="594" width="202" height="14" rx="7" fill="#e5e0d8"/>
  <rect x="782" y="619" width="218" height="14" rx="7" fill="#e5e0d8"/>
  <text x="600" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5e5751">Sur mobile, les elements changent de taille et de place pour rester utilisables.</text>
</svg>
