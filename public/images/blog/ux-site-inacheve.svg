  <text x="230" y="508" font-family="Arial, sans-serif" font-size="16" fill="#3f3b38">Premiere consultation ............ 65 EUR</text>
  <text x="230" y="541" font-family="Arial, sans-serif" font-size="16" fill="#3f3b38">Tarif etudtiants ..................... 50 EUR</text>
  <text x="230" y="574" font-family="Arial, sans-serif" font-size="16" fill="#3f3b38">Consultationa distance .......... 60 EUR</text>
  <text x="230" y="617" font-family="Arial, sans-serif" font-size="13" fill="#66605b">La premiere seance permet de faire connaissance et de preciser votre demande.</text>
  <text x="230" y="640" font-family="Arial, sans-serif" font-size="13" fill="#66605b">La premiere seance permet de faire connaissance et de preciser votre demande.</text>

  <rect x="714" y="472" width="226" height="45" rx="22" fill="#b86e69"/>
