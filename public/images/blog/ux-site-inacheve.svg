  <rect x="190" y="174" width="820" height="58" fill="#ede8df"/>
  <text x="230" y="210" font-family="Georgia, serif" font-size="23" fill="#37463f">Cabinet Horizon</text>
  <text x="594" y="207" font-family="Arial, sans-serif" font-size="12" fill="#4c514e">A PROPOS</text>
  <text x="680" y="207" font-family="Arial, sans-serif" font-size="12" fill="#4c514e">OUTILS</text>
  <text x="740" y="207" font-family="Arial, sans-serif" font-size="12" fill="#4c514e">TARIFS</text>
  <text x="803" y="207" font-family="Arial, sans-serif" font-size="12" fill="#4c514e">RENDEZ-VOUS</text>

  <rect x="220" y="258" width="450" height="164" fill="#f2eee7"/>
  <text x="445" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#514b46">Mes formations et outils</text>
  <text x="445" y="367" text-anchor="middle" font-family="Georgia, serif" font-size="41" font-style="italic" fill="#858078">en construction</text>
  <rect x="700" y="258" width="278" height="164" fill="#f7f5f1" stroke="#ddd5ca" stroke-width="2" stroke-dasharray="8 7"/>
  <path d="M804 311 l18 -18 18 18 25 -25 51 60 H762z" fill="#d8d2c9"/>
  <text x="839" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8a837a">image a venir</text>

