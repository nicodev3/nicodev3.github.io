<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Exemple fictif d'un site publie avant d'etre termine</title>
  <desc id="desc">Fausse capture d'ecran annotee montrant une rubrique en construction, un lien casse, une faute dans les tarifs, des mots colles, un paragraphe duplique et des boutons incoherents.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#342b27" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a64040"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="#f3efe8"/>
  <rect x="48" y="34" width="1104" height="56" rx="28" fill="#ded6ca"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#4c4540">EXEMPLE FICTIF - FINITION</text>

  <g filter="url(#shadow)">
    <rect x="190" y="120" width="820" height="572" rx="18" fill="#fff"/>
  </g>
  <rect x="190" y="120" width="820" height="54" rx="18" fill="#384c43"/>
