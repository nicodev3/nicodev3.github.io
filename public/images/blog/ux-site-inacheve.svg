  <text x="714" y="648" font-family="Arial, sans-serif" font-size="13" fill="#a64040">Erreur 404 - page introuvable</text>

  <rect x="34" y="266" width="132" height="52" rx="10" fill="#fff" stroke="#a64040" stroke-width="2"/>
  <text x="100" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#943838">Rubrique vide</text>
  <text x="100" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#943838">laissee en ligne</text>
  <path d="M166 292 C190 292 194 320 230 330" fill="none" stroke="#a64040" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1028" y="468" width="146" height="62" rx="10" fill="#fff" stroke="#a64040" stroke-width="2"/>
  <text x="1101" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#943838">Boutons sans</text>
  <text x="1101" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#943838">coherence</text>
  <path d="M1028 500 C992 500 984 512 944 520" fill="none" stroke="#a64040" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="30" y="582" width="150" height="62" rx="10" fill="#fff" stroke="#a64040" stroke-width="2"/>
  <text x="105" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#943838">Fautes, mots</text>
  <text x="105" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#943838">colles, repetition</text>
  <path d="M180 610 C204 600 197 570 226 557" fill="none" stroke="#a64040" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5e5751">Isoles, ces details semblent mineurs. Ensemble, ils rendent l'inachevement visible.</text>
</svg>
