<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Exemple fictif de texte difficile a lire sur une photographie</title>
  <desc id="desc">Comparaison entre une mauvaise interface ou le texte blanc se perd sur une image claire et une version corrigee avec un fond uni et un contraste suffisant.</desc>
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5dec2"/>
      <stop offset=".46" stop-color="#fff8e9"/>
      <stop offset=".47" stop-color="#98aa87"/>
      <stop offset="1" stop-color="#5b493c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#342b27" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#f3efe8"/>
