  <rect x="335" y="190" width="206" height="40" rx="20" fill="#fff"/>
  <text x="438" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9b3939">Contraste variable</text>

