<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dans quel ordre s’installer en libéral comme psychologue</title>
  <desc id="desc">Une frise présente les quatre temps de l’installation : poser le projet, obtenir le RPPS, déclarer l’activité et préparer l’ouverture.</desc>

  <defs>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #163b3b; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #526564; }
      .step-title { font: 700 27px Arial, sans-serif; fill: #163b3b; }
      .body { font: 400 21px Arial, sans-serif; fill: #425554; }
      .note-title { font: 700 21px Arial, sans-serif; fill: #163b3b; }
      .note { font: 400 19px Arial, sans-serif; fill: #526564; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#163b3b" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7faf8"/>
  <circle cx="1490" cy="55" r="220" fill="#dceee9" opacity=".65"/>
  <circle cx="90" cy="850" r="180" fill="#edf4e7" opacity=".85"/>

  <text x="110" y="105" class="title">Dans quel ordre avancer ?</text>
  <text x="110" y="150" class="subtitle">Les démarches s’enchaînent. Certaines peuvent ensuite avancer en parallèle.</text>

  <line x1="240" y1="274" x2="1360" y2="274" stroke="#b9cfca" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="90" y="230" width="330" height="390" rx="26" fill="#ffffff"/>
    <rect x="450" y="230" width="330" height="390" rx="26" fill="#ffffff"/>
    <rect x="810" y="230" width="330" height="390" rx="26" fill="#ffffff"/>
    <rect x="1170" y="230" width="330" height="390" rx="26" fill="#ffffff"/>
  </g>

  <g>
    <circle cx="150" cy="274" r="18" fill="#2e706a"/>
    <circle cx="510" cy="274" r="18" fill="#2e706a"/>
    <circle cx="870" cy="274" r="18" fill="#2e706a"/>
    <circle cx="1230" cy="274" r="18" fill="#2e706a"/>
  </g>

  <g>
    <text x="130" y="355" class="step-title">Poser le projet</text>
    <text x="130" y="404" class="body">
      <tspan x="130" dy="0">Public reçu, rythme,</tspan>
      <tspan x="130" dy="34">cabinet ou visio,</tspan>
      <tspan x="130" dy="34">budget et seuil de</tspan>
      <tspan x="130" dy="34">viabilité.</tspan>
    </text>

    <text x="490" y="355" class="step-title">Obtenir le RPPS</text>
    <text x="490" y="404" class="body">
      <tspan x="490" dy="0">Réunir les justificatifs</tspan>
      <tspan x="490" dy="34">du titre, puis faire</tspan>
      <tspan x="490" dy="34">l’enregistrement</tspan>
      <tspan x="490" dy="34">auprès de l’ARS.</tspan>
    </text>

    <text x="850" y="355" class="step-title">Déclarer l’activité</text>
    <text x="850" y="404" class="body">
      <tspan x="850" dy="0">Formalité sur le guichet</tspan>
      <tspan x="850" dy="34">unique de l’INPI, puis</tspan>
      <tspan x="850" dy="34">réception du SIREN,</tspan>
      <tspan x="850" dy="34">du SIRET et du code APE.</tspan>
    </text>

    <text x="1210" y="355" class="step-title">Préparer l’ouverture</text>
    <text x="1210" y="404" class="body">
      <tspan x="1210" dy="0">RC Pro, compte dédié,</tspan>
      <tspan x="1210" dy="34">lieu, documents, outils</tspan>
      <tspan x="1210" dy="34">et informations utiles</tspan>
      <tspan x="1210" dy="34">aux patients.</tspan>
    </text>
  </g>

  <rect x="230" y="690" width="1140" height="112" rx="24" fill="#e6f1ee"/>
  <circle cx="290" cy="746" r="24" fill="#2e706a"/>
  <path d="M280 746l7 7 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="335" y="735" class="note-title">À préparer en parallèle</text>
  <text x="335" y="769" class="note">Le local et la visibilité peuvent avancer pendant les formalités, sans attendre que tout soit finalisé.</text>
</svg>
