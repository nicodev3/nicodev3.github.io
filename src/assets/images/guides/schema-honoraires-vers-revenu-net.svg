<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De tes honoraires a ton revenu net</title>
  <desc id="desc">Schema simplifie montrant les prelevements successifs entre honoraires encaisses et revenu net disponible.</desc>
  <defs>
    <style>
      .title { font: 700 50px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 22px Arial, sans-serif; fill: #1e293b; }
      .small { font: 700 20px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc" />
  <text x="800" y="88" text-anchor="middle" class="title">De tes honoraires a ton revenu net</text>
  <text x="800" y="126" text-anchor="middle" class="subtitle">Visualiser les prelevements pour piloter ta tresorerie en liberal</text>
  <rect x="80" y="220" width="260" height="240" rx="22" ry="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="3" />
  <text x="210" y="285" text-anchor="middle" class="boxTitle">1</text>
  <text x="210" y="335" text-anchor="middle" class="boxTitle">Honoraires</text>
  <text x="210" y="375" text-anchor="middle" class="boxText">encaisses</text>
  <rect x="390" y="220" width="260" height="240" rx="22" ry="22" fill="#fee2e2" stroke="#fca5a5" stroke-width="3" />
  <text x="520" y="285" text-anchor="middle" class="boxTitle">2</text>
  <text x="520" y="335" text-anchor="middle" class="boxTitle">Charges</text>
  <text x="520" y="375" text-anchor="middle" class="boxText">de fonctionnement</text>
  <text x="520" y="420" text-anchor="middle" class="small">-</text>
  <rect x="700" y="220" width="260" height="240" rx="22" ry="22" fill="#ffedd5" stroke="#fdba74" stroke-width="3" />
  <text x="830" y="285" text-anchor="middle" class="boxTitle">3</text>
  <text x="830" y="335" text-anchor="middle" class="boxTitle">Cotisations</text>
  <text x="830" y="375" text-anchor="middle" class="boxText">sociales</text>
  <text x="830" y="420" text-anchor="middle" class="small">-</text>
  <rect x="1010" y="220" width="260" height="240" rx="22" ry="22" fill="#fef3c7" stroke="#fcd34d" stroke-width="3" />
  <text x="1140" y="285" text-anchor="middle" class="boxTitle">4</text>
  <text x="1140" y="335" text-anchor="middle" class="boxTitle">Impot</text>
  <text x="1140" y="375" text-anchor="middle" class="boxText">a provisionner</text>
  <text x="1140" y="420" text-anchor="middle" class="small">-</text>
  <rect x="1320" y="220" width="200" height="240" rx="22" ry="22" fill="#dcfce7" stroke="#86efac" stroke-width="3" />
  <text x="1420" y="285" text-anchor="middle" class="boxTitle">5</text>
  <text x="1420" y="335" text-anchor="middle" class="boxTitle">Revenu</text>
  <text x="1420" y="375" text-anchor="middle" class="boxText">net</text>
  <text x="1420" y="410" text-anchor="middle" class="boxText">disponible</text>
  <line x1="350" y1="340" x2="380" y2="340" stroke="#334155" stroke-width="7" marker-end="url(#arrow)" />
  <line x1="660" y1="340" x2="690" y2="340" stroke="#334155" stroke-width="7" marker-end="url(#arrow)" />
  <line x1="970" y1="340" x2="1000" y2="340" stroke="#334155" stroke-width="7" marker-end="url(#arrow)" />
  <line x1="1280" y1="340" x2="1310" y2="340" stroke="#334155" stroke-width="7" marker-end="url(#arrow)" />
  <rect x="120" y="540" width="1360" height="220" rx="20" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="160" y="600" class="boxTitle">Logique de calcul</text>
  <text x="160" y="645" class="boxText">Honoraires encaisses - charges de fonctionnement - cotisations sociales - impot provisionne = revenu net disponible</text>
  <text x="160" y="695" class="boxText">Ce schema donne un repere simple pour eviter de confondre chiffre d'affaires et revenu reellement utilisable.</text>
</svg>
